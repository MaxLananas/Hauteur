name: build

# Runs on pull requests into main and on demand. Pushes to branches do not run it (a PR is the check), and
# there is no weekly schedule: the Geyser drift probe is a manual run with geyser_drift set to true.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      geyser_drift:
        description: 'Rebuild against the newest Geyser snapshot (drift probe)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GEYSER_VERSION: ${{ vars.GEYSER_VERSION || '2.11.2-SNAPSHOT' }}
  GEYSER_DRIFT: ${{ inputs.geyser_drift == true }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Coordinate-math oracle (Python mirror of WindowRules and SectionCodec)
        run: python3 dev/verify/oracle.py 5
      - name: Python tooling tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s dev/verify -p 'test_*.py' -v
          python3 -m unittest discover -s dev/release -p 'test_*.py' -v
      - name: Benchmark compiles and runs (smoke, not a measurement)
        # The timing run is manual (docs/VERIFICATION.md). CI only proves the benchmark still builds and that
        # its synthetic payloads still parse without anomaly.
        run: |
          set -euo pipefail
          javac -d "$RUNNER_TEMP/bench" src/main/java/io/github/maxlananas/hauteur/chunk/SectionCodec.java dev/bench/SectionCodecBench.java
          java -cp "$RUNNER_TEMP/bench" SectionCodecBench 50
      - name: Build and test against Geyser ${{ env.GEYSER_VERSION }}
        run: |
          set +e
          # With geyser_drift, -U makes Maven re-resolve the SNAPSHOT. Otherwise Maven's default snapshot policy applies.
          UPDATE=""
          if [ "$GEYSER_DRIFT" = "true" ]; then UPDATE="-U"; fi
          ./mvnw -B -ntp $UPDATE \
              -Dgeyser.version="$GEYSER_VERSION" verify 2>&1 | tee mvn.log
          ec=${PIPESTATUS[0]}
          if [ "$ec" -ne 0 ]; then
            # Surface real errors as annotations: the raw log stream can be unavailable.
            grep -E "\[ERROR\]" mvn.log | head -50 | while IFS= read -r line; do
              printf '::error::%s\n' "$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')"
            done
          fi
          exit "$ec"
      - name: Test summary
        if: always()
        run: python3 dev/verify/surefire_summary.py target/surefire-reports >> "$GITHUB_STEP_SUMMARY"
      - name: Test annotations
        # Totals and failing test names as annotations: readable through the check-run API even when the
        # job log is not, so a red run can be diagnosed without the raw log stream.
        if: always()
        run: python3 dev/verify/surefire_summary.py --annotate target/surefire-reports
      - name: Upload extension jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hauteur-extension
          path: target/hauteur-*.jar
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore
