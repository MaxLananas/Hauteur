version: 2
# Monthly and grouped: each open update PR runs the build, so weekly single-dependency PRs cost Actions minutes.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      maven:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /dev/release
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
